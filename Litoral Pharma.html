	<script>
	  // Pega todos os elementos <audio> da página
	  const audios = document.querySelectorAll('audio');

	  function tocarAudio(id) {
		// Para todos os áudios
		audios.forEach(audio => {
		  if (!audio.paused) {
			audio.pause();
			audio.currentTime = 0; // volta pro começo
		  }
		});

		// Toca o áudio selecionado
		const audioSelecionado = document.getElementById(id);
		if (audioSelecionado) {
		  audioSelecionado.play();
		}
	  }
	</script>
